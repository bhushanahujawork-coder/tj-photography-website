services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tjphotography
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: tj_photography
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "psql -U tjphotography -d tj_photography -c 'SELECT 1'"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://tjphotography:${POSTGRES_PASSWORD:-changeme}@postgres:5432/tj_photography
      SECRET_KEY: ${SECRET_KEY}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:3000"]}
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /app/storage
      LOG_LEVEL: INFO
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: tjphotography
      DB_NAME: tj_photography
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      SEED_DATABASE: "true"
    volumes:
      - backend_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  backend_storage:
